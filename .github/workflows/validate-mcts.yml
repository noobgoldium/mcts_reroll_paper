name: Validate MCTS STOP engine

on:
  push:
    branches:
      - fix/mcts-constraints-and-records
      - feat/slot-match-events
  pull_request:
    branches:
      - main

jobs:
  compile-and-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Set up Python analysis dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy pandas scikit-learn pyyaml

      - name: Compile C++26 engine
        run: |
          g++-14 -O2 -std=c++26 -pthread -Wall -Wextra -Wpedantic mcts_engine.cpp -o mcts_engine

      - name: Run small simulation
        run: |
          mkdir -p out
          ./mcts_engine --tier 0 --goal 0 --n_starts 2 --n_sim 100 --id_start 0 --id_end 1 --seed 123456 --out out/smoke.csv
          ./mcts_engine --tier 0 --goal 0 --n_starts 2 --n_sim 100 --id_start 0 --id_end 1 --seed 123456 --out out/smoke_repeat.csv
          cmp out/smoke.csv out/smoke_repeat.csv
          .venv/bin/python -m py_compile q1_classifier.py q1_policy_analysis.py q2_regression.py merge_mcts_chunks.py
          mkdir -p out/merge_chunks out/merge_result
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path("out/merge_chunks")
          fields = ["resource_tier", "goal_id", "biscuit_id", "rng_seed", "decision_step"]
          for chunk, ids in ((0, (0, 1)), (1, (2, 3))):
              path = root / f"biscuit_tier_0_goal_0_chunk_{chunk}.csv"
              with path.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  for biscuit_id in ids:
                      writer.writerow({
                          "resource_tier": 0, "goal_id": 0,
                          "biscuit_id": biscuit_id, "rng_seed": 1000 + biscuit_id,
                          "decision_step": 0,
                      })
          PY
          .venv/bin/python merge_mcts_chunks.py --input-dir out/merge_chunks --output-dir out/merge_result --tier 0 --goals 0 --chunks 0,1 --chunk-size 2
          .venv/bin/python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("out/merge_result/biscuit_tier_0_merged.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 4, f"expected 4 merged rows, got {len(rows)}"
          assert {int(row["biscuit_id"]) for row in rows} == {0, 1, 2, 3}
          print("validated merged CSV: 4 rows, complete biscuit ID coverage")
          PY
          .venv/bin/python - <<'PY'
          import yaml
          for path in (".github/workflows/run_mcts.yml", ".github/workflows/validate-mcts.yml"):
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("valid YAML:", path)
          PY
          ./mcts_engine --tier 0 --goal 0 --n_starts 30 --id_start 0 --id_end 30 --seed 123456 --q1_compare --q1_out out/q1_smoke.csv
          ./mcts_engine --tier 0 --goal 0 --n_starts 30 --id_start 0 --id_end 30 --seed 123456 --q1_compare --q1_out out/q1_smoke_repeat.csv
          cmp out/q1_smoke.csv out/q1_smoke_repeat.csv
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          with open("out/q1_smoke.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 60, f"expected 60 paired policy rows, got {len(rows)}"
          paired = defaultdict(list)
          for row in rows:
              paired[row["biscuit_id"]].append(row)
          assert len(paired) == 30
          for biscuit_id, pair in paired.items():
              assert {r["policy"] for r in pair} == {"Q1-A", "Q1-B"}
              a, b = sorted(pair, key=lambda r: r["policy"])
              initial_cols = [f"initial_{name}" for i in range(4) for name in (f"opt{i}", f"val{i}")]
              assert all(a[c] == b[c] for c in initial_cols), f"unpaired initial biscuit {biscuit_id}"
          print(f"validated {len(rows)} Q1 rows across {len(paired)} paired biscuits")
          PY
          .venv/bin/python q1_policy_analysis.py out/q1_smoke.csv --bootstrap 200 --output out/q1_analysis.csv
          test -s out/q1_analysis.csv
          mkdir -p out/q2_synthetic
          python3 - <<'PY'
          import csv
          from pathlib import Path

          fields = ["resource_tier", "goal_id", "biscuit_id", "rng_seed",
                    "bl_remaining_at_switch", "decision_step"]
          for slot in range(4):
              fields += [f"slot{slot}_{name}" for name in (
                  "opt_idx", "value", "tier", "matched", "match_event",
                  "match_action", "match_x", "match_step", "match_score")]
          path = Path("out/q2_synthetic/biscuit_tier_0_goal_0.csv")
          with path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for biscuit in range(80):
                  for event_index, x in enumerate((1, 2, 3, 4)):
                      slot = event_index
                      ratio = 0.25 + 0.1 * event_index
                      row = {
                          "resource_tier": 0, "goal_id": 0, "biscuit_id": biscuit,
                          "rng_seed": 123456 + biscuit, "bl_remaining_at_switch": 10,
                          "decision_step": x,
                      }
                      for pos in range(4):
                          row.update({
                              f"slot{pos}_opt_idx": 0,
                              f"slot{pos}_value": 3.0 + ratio * 4.5 if pos == slot else 3.0,
                              f"slot{pos}_tier": 2 if pos == slot else 1,
                              f"slot{pos}_matched": 1 if pos == slot else 0,
                              f"slot{pos}_match_event": 1 if pos == slot else 0,
                              f"slot{pos}_match_action": pos + 1 if pos == slot else -1,
                              f"slot{pos}_match_x": x if pos == slot else -1,
                              f"slot{pos}_match_step": x if pos == slot else -1,
                              f"slot{pos}_match_score": ratio * 10.0 if pos == slot else -1.0,
                          })
                      writer.writerow(row)
              # One general-dough match is deliberately present and must be excluded.
              general = {key: 0 for key in fields}
              general.update({
                  "resource_tier": 0, "goal_id": 0, "biscuit_id": 0,
                  "rng_seed": 123456, "bl_remaining_at_switch": -1,
                  "decision_step": 0,
              })
              for pos in range(4):
                  general.update({
                      f"slot{pos}_opt_idx": 0, f"slot{pos}_value": 3.0,
                      f"slot{pos}_tier": 1, f"slot{pos}_matched": 1 if pos == 0 else 0,
                      f"slot{pos}_match_event": 1 if pos == 0 else 0,
                      f"slot{pos}_match_action": 0 if pos == 0 else -1,
                      f"slot{pos}_match_x": -1, f"slot{pos}_match_step": 0,
                      f"slot{pos}_match_score": 0.0 if pos == 0 else -1.0,
                  })
              writer.writerow(general)
          PY
          .venv/bin/python q2_regression.py --csv-dir out/q2_synthetic --bootstrap 100 --min-episodes-per-point 2 --output-prefix out/q2_smoke
          test -s out/q2_smoke_slot_events.csv
          test -s out/q2_smoke_curve_by_spent.csv
          test -s out/q2_smoke_curve_by_spent_and_slot.csv
          test -s out/q2_smoke_curve_by_remaining.csv
          test -s out/q2_smoke_curve_by_remaining_and_slot.csv
          .venv/bin/python - <<'PY'
          from q2_regression import load_slot_events, summarize_curve

          events = load_slot_events("out/q2_synthetic")
          assert len(events) == 320, f"expected 320 light events, got {len(events)}"
          assert set(events["match_action"]) == {1, 2, 3, 4}
          assert all(events["match_action"] == events["slot"] + 1)
          assert set(events["x_light_spent"]) == {1, 2, 3, 4}
          assert set(events["n_light_remaining"]) == {6, 7, 8, 9}
          summary = summarize_curve(
              events, ["resource_tier", "goal_id", "x_light_spent"],
              min_episodes=2, n_boot=100, seed=42
          )
          assert len(summary) == 4
          assert summary["episodes"].eq(80).all()
          assert summary["meets_min_episodes"].all()
          print("validated 320 light-only slot events, x/n mapping, and episode bootstrap")
          PY

      - name: Validate new CSV schema and terminal records
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("out/smoke.csv")
          with path.open(newline="") as f:
              rows = list(csv.DictReader(f))

          assert rows, "simulation produced no decision records"
          required = {
              "q_stop", "q_continue", "biscuit_score", "matched_count",
              "goal_achieved", "bg_spent", "bl_spent", "decision_step",
              "terminal_reason", "rng_seed", "state_samples",
              "state_progress_mean", "state_matched_mean", "state_bg_mean",
              "state_bl_mean", "state_score_mean", "state_matched_min",
              "state_matched_max", "q_stop_visits", "q_continue_visits",
              "q_continue_action",
          }
          assert required.issubset(rows[0].keys()), "missing STOP-analysis columns"
          assert all(int(row["best_action"]) in {-1, 0, 1, 2, 3, 4, 5} for row in rows)
          assert all(int(row["terminal_reason"]) in {0, 1, 2} for row in rows)
          assert any(int(row["terminal_reason"]) in {1, 2} for row in rows), "no terminal episode record"
          print(f"validated {len(rows)} state/terminal rows")
          PY
