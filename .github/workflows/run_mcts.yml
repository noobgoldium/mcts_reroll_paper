name: MCTS Massive Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install GCC-14 & Build
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-14
          g++-14 -O3 -march=native -flto -funroll-loops -pipe -std=c++26 -pthread mcts_engine.cpp -o mcts_engine

      - name: Run MCTS Engine with Auto-Commit
        run: |
          # 1. 백그라운드로 엔진 실행
          ./mcts_engine &
          
          # 2. 5분마다 결과 CSV를 깃허브 레포지토리에 자동 백업 (커밋 & 푸시)
          while kill -0 $! 2>/dev/null; do
            sleep 300
            git pull --rebase || true
            git add biscuit_tier_*.csv || true
            git commit -m "Auto-save MCTS chunk progress [skip ci]" || true
            git push || true
          done
          
          # 3. 종료 직전 최종 남은 파일 강제 푸시
          git pull --rebase || true
          git add biscuit_tier_*.csv || true
          git commit -m "Final MCTS results push [skip ci]" || true
          git push || true

      - name: Auto-trigger next run if incomplete
        if: always()
        run: |
          # 총 50개 청크 중 아직 완성 안 된 것이 있다면 다음 릴레이 자동 예약
          COMPLETED_COUNT=$(ls biscuit_tier_*.csv 2>/dev/null | wc -l)
          echo "현재 완성된 청크 수: $COMPLETED_COUNT / 50"
          
          if [ "$COMPLETED_COUNT" -lt 50 ]; then
            echo "아직 연산이 남았으므로 다음 릴레이를 자동 호출합니다."
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_mcts.yml/dispatches \
              -d '{"ref":"main"}'
          else
            echo "모든 연산(50개 청크)이 완벽하게 끝났습니다!"
          fi
