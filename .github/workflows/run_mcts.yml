name: MCTS Massive Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 깃허브가 단독으로 자동 실행

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # 💡 핵심: 동시에 여러 작업이 겹치지 않게 하나로 제어 (중복 실행 방지)
    concurrency:
      group: mcts-simulation
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install GCC-14 & Build
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-14
          g++-14 -O3 -march=native -flto -funroll-loops -pipe -std=c++26 -pthread mcts_engine.cpp -o mcts_engine

      - name: Run MCTS Engine with Auto-Commit
        run: |
          # 1. 백그라운드로 엔진 실행
          ./mcts_engine &
          
          # 2. 5분마다 결과 CSV를 깃허브 레포지토리에 자동 백업
          while kill -0 $! 2>/dev/null; do
            sleep 300
            git pull --rebase || true
            git add biscuit_tier_*.csv || true
            git commit -m "Auto-save MCTS chunk progress [skip ci]" || true
            git push || true
          done
          
          # 3. 종료 직전 최종 남은 파일 강제 푸시
          git pull --rebase || true
          git add biscuit_tier_*.csv || true
          git commit -m "Final MCTS results push [skip ci]" || true
          git push || true
